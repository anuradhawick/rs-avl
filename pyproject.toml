[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rs-avl"
description = "A fast AVL ordered set backed by Rust"
readme = { file = "python_readme.md", content-type = "text/markdown" }
license = "GPL-3.0-only OR Apache-2.0"
license-files = ["LICENSE-GPL-3.0", "LICENSE-APACHE-2.0"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/anuradhawick/rs-avl"
Documentation = "https://docs.rs/rs-avl"
Repository = "https://github.com/anuradhawick/rs-avl"
Issues = "https://github.com/anuradhawick/rs-avl/issues"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module", "pyo3/experimental-inspect"]
